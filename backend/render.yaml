services:
  - type: web
    name: deal-sniper-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_EBAY_ACTOR
        value: datascrapers~ebay-scraper
      - key: APIFY_FACEBOOK_ACTOR
        value: apify~facebook-marketplace-scraper
      - key: OPENAI_API_KEY
        sync: false
      - key: CRAWL_ENABLED
        value: "false"
